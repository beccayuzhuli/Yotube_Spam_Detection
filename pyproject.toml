[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-spam-detection"
version = "0.1.0"
description = "Hybrid TF-IDF and RoBERTa feature pipeline for YouTube spam detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "kagglehub>=0.3,<1.0",
]

[project.optional-dependencies]
roberta = ["torch>=2.2", "transformers>=4.40"]
boosting = ["xgboost>=2.0", "lightgbm>=4.3"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
